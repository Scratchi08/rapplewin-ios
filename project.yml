# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: RAppleWin
options:
  bundleIdPrefix: com.example
  deploymentTarget: { iOS: "16.0" }
settings:
  base:
    SWIFT_VERSION: 5.9
    CLANG_CXX_LANGUAGE_STANDARD: gnu++17
targets:
  RAppleWin:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - Sources/Bridge
      - { path: Resources, buildPhase: resources }
      # RetroAchievements runtime (cloned by scripts/build_core.sh). rhash/libretro/RAIntegration are not needed.
      - path: Core/rcheevos/src
        includes: ["**/*.c", "**/*.h"]
        excludes: ["**/rc_libretro.*", "**/*raintegration*", "**/rc_client_external.*"]
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/RAppleWin-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: com.example.RAppleWin
        INFOPLIST_FILE: Sources/App/Info.plist
        # Static libretro core built by scripts/build_core.sh
        LIBRARY_SEARCH_PATHS: ["$(PROJECT_DIR)/Core/build/$(PLATFORM_NAME)"]
        OTHER_LDFLAGS: ["-lapplewin_libretro", "-lz", "-framework", "AVFoundation"]
        HEADER_SEARCH_PATHS: ["$(PROJECT_DIR)/Sources/Bridge", "$(PROJECT_DIR)/Core/rcheevos/include", "$(PROJECT_DIR)/Core/rcheevos/src"]
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "RC_DISABLE_LUA=1"]
